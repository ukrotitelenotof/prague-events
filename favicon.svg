<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0e2e"/>
      <stop offset="0.5" stop-color="#0d1f3e"/>
      <stop offset="1" stop-color="#190e00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e090"/>
      <stop offset="0.55" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#9a7a35"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Prague skyline silhouette: castle, cathedral spires, bridge tower, rooftops -->
  <g fill="url(#gold)">
    <!-- cathedral twin spires -->
    <path d="M14 46 L14 30 L16 26 L18 30 L18 46 Z"/>
    <path d="M20 46 L20 30 L22 26 L24 30 L24 46 Z"/>
    <!-- castle block -->
    <rect x="14" y="38" width="12" height="8"/>
    <!-- bridge tower -->
    <path d="M30 46 L30 24 L33 20 L36 24 L36 46 Z"/>
    <rect x="29" y="30" width="8" height="16"/>
    <!-- dome -->
    <path d="M40 46 L40 34 Q44 28 48 34 L48 46 Z"/>
    <rect x="43" y="22" width="2" height="8"/>
    <!-- rooftops -->
    <path d="M50 46 L50 36 L54 32 L58 36 L58 46 Z"/>
  </g>
  <!-- star accent -->
  <circle cx="44" cy="20" r="1.6" fill="#f5e090"/>
</svg>
